<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nouveau mot de passe — DDRKY</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">

        <div class="logo">
            DDRKY
        </div>

        <nav class="navigation">

            <a href="index.html">
                Accueil
            </a>

            <a href="boutique.html">
                Boutique
            </a>

        </nav>

    </header>


    <main>

        <section class="application-section">

            <div class="application-container">

                <div class="application-title">

                    <p>DDRKY ADMINISTRATION</p>

                    <h1>
                        Nouveau mot de passe
                    </h1>

                    <h2>
                        RÉINITIALISATION
                    </h2>

                    <span>
                        Crée un nouveau mot de passe pour ton compte administrateur.
                    </span>

                </div>


                <form id="updatePasswordForm">

                    <div class="form-group">

                        <label for="newPassword">
                            Nouveau mot de passe
                        </label>

                        <input
                            type="password"
                            id="newPassword"
                            name="newPassword"
                            placeholder="Nouveau mot de passe"
                            minlength="6"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirmer le mot de passe
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirmer le mot de passe"
                            minlength="6"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="submit-button"
                    >
                        Enregistrer le nouveau mot de passe
                    </button>

                </form>


                <p
                    id="updatePasswordMessage"
                    style="
                        text-align: center;
                        margin-top: 20px;
                        font-weight: bold;
                    "
                ></p>


                <div style="
                    text-align: center;
                    margin-top: 25px;
                ">

                    <a href="admin-connexion.html">
                        Retour à la connexion administrateur
                    </a>

                </div>

            </div>

        </section>

    </main>


    <footer class="footer">

        <div class="footer-logo">
            DDRKY
        </div>

        <p>
            From Darkness to Greatness.
        </p>

        <p class="copyright">
            © 2026 DDRKY — Tous droits réservés.
        </p>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <script src="script.js"></script>

</body>

</html>
